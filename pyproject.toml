[project]
name = "pytest-fsd"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lebedev Nikita", email = "rachet337@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "pytest-archon>=0.0.7",
    "tomli>=2.0.1; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
