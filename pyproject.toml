[project]
name = "pytest-fsd"
version = "0.2.1"
description = "Feature-Sliced Design (FSD) architecture validation plugin for pytest"
readme = "README.md"
authors = [
    { name = "Lebedev Nikita", email = "rachet337@gmail.com" }
]
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Architecture",
]
dependencies = [
    "pytest-archon>=0.0.7",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Horcag/pytest-fsd"
Repository = "https://github.com/Horcag/pytest-fsd.git"
"Bug Tracker" = "https://github.com/Horcag/pytest-fsd/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
